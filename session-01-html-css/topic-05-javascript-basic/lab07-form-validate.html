<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form validate</title>
  <style type="text/css">
    #err { color: #ff0000; }
  </style>
</head>
<body>
  <h1>Form validation</h1>
  <form action="https://www.google.com/search" method="get">
    <div>
      <span>Keyword</span>
      <input type="text" name="q" id="q" />
      <button type="submit">Search</button>
    </div>
  </form>
  <div id="err"></div>

  <script>
    document.querySelector('form').onsubmit = function() {
      let text_field = document.querySelector('#q');
      let text_err = document.querySelector('#err');

      if (text_field.value.length === 0){
        text_field.focus();
        text_err.innerText = "Keyword is not blank";
        return false;
      } else {
        text_err.innerText = "";
        return true;
      }
    }
  </script>
</body>
</html>
