<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Window Object</title>
</head>
<body onload="document.bgColor='#c8f4de';">
  <h1>Window Object</h1>

  <script type="text/javascript">
    current_url = window.location;
    document.writeln(`<div>Location: ${current_url} </div>`)
  </script>
  <hr/>

  <button type="button" onclick="window.location='https://www.google.com'">Navigate to Google</button>
  <button type="button" onclick="window.open('https://www.google.com')">Open new Window to navigate to google</button>
  <button type="button" onclick="showBrowserInfo()">Show browser information</button>

  <script >
    function showBrowserInfo(){
      let info = window.navigator.appName;
      info += "\n" + window.navigator.appVersion;

      alert(info)
    }
  </script>
  <hr/>

  <button type="button" onclick="handleAlert()">Alert</button>
  <button type="button" onclick="handleConfirm()">Confirm</button>
  <button type="button" onclick="handlePrompt()">Prompt</button>
  
  <script>
    function handleAlert(){
      window.alert('Just show message');
    }

    function handleConfirm(){
      let result = window.confirm('Do you confirm the information');
      window.alert("Result = " + result)
    }

    function handlePrompt(){
      let result = window.prompt('What is your name?', 'no-name')
      window.alert("Result = " + result)
    }
  </script>
</body>
</html>
