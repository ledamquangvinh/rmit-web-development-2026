<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1> Using JS to create and render HTML tag</h1>

  <script>
    for(var i = 0; i < 10; i++){
      document.write('<p>Hello item ' + i + '</p>')
    }

    while(i++ < 20){
      document.writeln('<div>Add item ' + i + '</div>')
    }
  </script>
</body>
</html>
