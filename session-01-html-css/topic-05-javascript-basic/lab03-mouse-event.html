<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Event</title>
        <style type="text/css">
            .color-red{ background-color: #cc3366; color: #ffffff;}
            .color-green{ background-color: #27aa80; color: #ffffff;}
            .color-blue{ background-color: #80d6ff; color: #ffffff}

            div{
              width: 300px;
              height: 200px;
              margin: 50px;
              background-color: #caf7e3;
            }
        </style>
    </head>
    <body>
      <h1>Event in button</h1>
      <button type="botton" onclick="document.bgColor='#cc3366'">Click me</button>
      <div onclick="mouseClick(this)" onmouseover="mouseOver(this)" onmouseout="mouseOut(this)"></div>

      <script>
        function mouseClick(control) { control.className = 'color-red'; }
        function mouseOver(control) { control.className = 'color-green';}
        function mouseOut(control) { control.className = 'color- blue';}
      </script>
    </body>
</html>
